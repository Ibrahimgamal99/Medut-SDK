// No buildscript {} block on purpose. Flutter's plugin-loader
// (dev.flutter.flutter-plugin-loader in the HOST app's settings.gradle)
// supplies AGP on its classpath; a plugin that pins its own AGP version here
// drags a SECOND, usually older, toolchain into the build and breaks host
// apps on newer Gradle. The `plugins` DSL resolves whatever the host already
// has — and must be the file's first statement (Gradle rule).
//
// No Kotlin plugin either (Flutter's built-in Kotlin migration): Flutter's
// Gradle plugin applies Kotlin to this project itself, from the host's
// classpath or AGP's built-in Kotlin, so applying it here would be the second
// toolchain again. Needs Flutter 3.44+.
plugins {
    id 'com.android.library'
}

group = 'dev.medut.flutter'
version = '1.0.0'

// The Kotlin SDK (bindings/kotlin) is compiled into this module from source:
// its Kotlin, its JNI layer, and the prebuilt libmedut.so it packages. A
// release would depend on its published AAR instead.
def medutSdk = file('../../kotlin/medut')
def medutInclude = file('../../../include')

android {
    namespace = 'dev.medut.flutter'
    // AGP 9 requires compileSdk >= 35; harmless on older AGP.
    compileSdk = 36

    defaultConfig {
        minSdk = 24
        consumerProguardFiles "${medutSdk}/consumer-rules.pro"
        // The ABIs the prebuilt core ships (scripts/build-android.sh).
        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86_64'
        }
        externalNativeBuild {
            cmake {
                arguments "-DMEDUT_JNILIBS=${medutSdk}/src/main/jniLibs",
                          "-DMEDUT_INCLUDE=${medutInclude}"
            }
        }
    }

    sourceSets {
        main {
            // The SDK's manifest too: its permissions, the Telecom
            // ConnectionService and the notification action receiver.
            manifest.srcFile "${medutSdk}/src/main/AndroidManifest.xml"
            java.srcDirs += "${medutSdk}/src/main/kotlin"
            jniLibs.srcDirs = ["${medutSdk}/src/main/jniLibs"]
        }
    }

    externalNativeBuild {
        cmake {
            path "${medutSdk}/src/main/cpp/CMakeLists.txt"
            version "3.22.1"
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging = false
        }
    }
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
    }
}

dependencies {
    compileOnly 'androidx.annotation:annotation:1.7.1'
    // Pigeon's generated Kotlin delivers Dart-bound calls as coroutines.
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2'
}
