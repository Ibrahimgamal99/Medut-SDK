name: echo_sdk
description: >-
  Flutter/Dart SIP softphone SDK (baresip-based): UDP/TCP/TLS/WS/WSS
  registration, calls, codec control, reconnection & network handover,
  media statistics and quality alerts.
version: 1.1.0
homepage: https://github.com/NawyRE/echo-sdk
repository: https://github.com/NawyRE/echo-sdk
issue_tracker: https://github.com/NawyRE/echo-sdk/issues
documentation: https://github.com/NawyRE/echo-sdk/blob/main/docs/quickstart/flutter.md
topics:
  - sip
  - voip
  - softphone
  - webrtc
  - ffi

environment:
  sdk: ">=3.1.0 <4.0.0"
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  ffi: ^2.1.0

dev_dependencies:
  ffigen: ^12.0.0
  flutter_test:
    sdk: flutter

flutter:
  plugin:
    platforms:
      # Android is a hybrid plugin:
      #  - ffiPlugin ships the prebuilt libechosdk.so from src/main/jniLibs
      #  - EchoSDKPlugin (Kotlin) provides cache dir, audio focus, speaker
      #    routing and ConnectivityManager callbacks over MethodChannel.
      android:
        package: dev.echosdk.flutter
        pluginClass: EchoSDKPlugin
        ffiPlugin: true
      # iOS vendors the prebuilt dynamic EchoSDK.xcframework via the podspec
      # (built by scripts/build-ios.sh on macOS/CI) plus a Swift shim for
      # audio session / speaker routing / NWPathMonitor callbacks.
      ios:
        pluginClass: EchoSDKPlugin
      # Desktop: the app bundles the native library itself (or passes
      # EchoSDK(libPath: ...)); see lib/src/sdk.dart loadLib().
