name: medut
description: >-
  Flutter SIP softphone SDK for Android, iOS and desktop (baresip-based): UDP/TCP/TLS/
  WS/WSS registration, calls, codec control, reconnection & network handover,
  media statistics and quality alerts.
version: 1.0.0
homepage: https://github.com/Ibrahimgamal99/Medut-SDK
repository: https://github.com/Ibrahimgamal99/Medut-SDK
issue_tracker: https://github.com/Ibrahimgamal99/Medut-SDK/issues
documentation: https://github.com/Ibrahimgamal99/Medut-SDK/blob/main/docs/quickstart/flutter.md
topics:
  - sip
  - voip
  - softphone
  - webrtc
  - pigeon
  - ffi

environment:
  sdk: ">=3.12.0 <4.0.0"
  # Built-in Kotlin: the Android plugin no longer applies the Kotlin Gradle
  # Plugin itself.
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  # Desktop backend (lib/src/ffi_backend.dart).
  ffi: ^2.1.0

dev_dependencies:
  # Desktop FFI bindings: dart run ffigen --config ffigen.yaml
  ffigen: ^12.0.0
  flutter_test:
    sdk: flutter
  # Mobile glue: dart run pigeon --input pigeons/messages.dart
  pigeon: ^29.0.8

flutter:
  plugin:
    platforms:
      # Pigeon over the native SDKs, which own the stack: the Kotlin SDK
      # (bindings/kotlin) on Android and MedutKit (bindings/swift) on iOS.
      android:
        package: dev.medut.flutter
        pluginClass: MedutPlugin
      ios:
        pluginClass: MedutPlugin
      # Linux, macOS and Windows are not declared: there the Dart side drives
      # the C library over dart:ffi (lib/src/ffi_backend.dart), and the app
      # ships medut.so / medut.dylib / medut.dll or passes Medut.start(libPath:).
