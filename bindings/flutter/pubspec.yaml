name: medut
description: >-
  Flutter SIP softphone SDK on Medut's own SIP/media stack:
  UDP/TCP/TLS/WS/WSS registration, calls, codec control, reconnection &
  network handover, media statistics and quality alerts. Native Kotlin/Swift
  SDKs on Android/iOS, dart:ffi on desktop.
version: 2.0.0
homepage: https://github.com/Ibrahimgamal99/Medut-SDK
repository: https://github.com/Ibrahimgamal99/Medut-SDK
issue_tracker: https://github.com/Ibrahimgamal99/Medut-SDK/issues
documentation: https://github.com/Ibrahimgamal99/Medut-SDK/blob/main/docs/quickstart/flutter.md
topics:
  - sip
  - voip
  - softphone
  - webrtc
  - pigeon

environment:
  sdk: ">=3.12.0 <4.0.0"
  # Built-in Kotlin: the Android plugin no longer applies the Kotlin Gradle
  # Plugin itself.
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  # Desktop backend (lib/src/ffi_backend.dart).
  ffi: ^2.1.0

dev_dependencies:
  # Desktop FFI bindings: dart run ffigen --config ffigen.yaml
  ffigen: ^12.0.0
  flutter_test:
    sdk: flutter
  # Mobile glue: dart run pigeon --input pigeons/messages.dart
  # Pinned exactly: CI regenerates the glue and fails on any diff, and
  # pubspec.lock is not committed, so a caret range let each new Pigeon
  # release (29.0.10 -> 29.1.0) break the check with cosmetic changes.
  pigeon: 29.1.0

flutter:
  plugin:
    platforms:
      # Pigeon over the native SDKs, which own the stack for the process
      # lifetime: the Kotlin SDK (bindings/kotlin/medut) on Android and
      # MedutKit (ios/MedutKit, also bindings/swift) on iOS.
      android:
        package: dev.medut.flutter
        pluginClass: MedutPlugin
      ios:
        pluginClass: MedutPlugin
      # Linux / macOS / Windows are not declared: there the Dart side drives
      # the C library directly over dart:ffi (lib/src/ffi_backend.dart) and
      # the app bundles medut.so / .dylib / .dll itself, or passes
      # Medut.start(libPath: ...). See lib/src/sdk.dart loadLib().
