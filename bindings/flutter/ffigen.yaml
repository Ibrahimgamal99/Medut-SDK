# ffigen configuration for Medut
# Run: dart run ffigen --config ffigen.yaml
# Output: lib/src/ffi_bindings.dart

name: MedutBindings
description: 'Auto-generated Dart FFI bindings for Medut.'
output: 'lib/src/ffi_bindings.dart'

headers:
  entry-points:
    - '../../include/medut.h'

compiler-opts:
  - '-I../../include'
  # ffigen ignores __attribute__((packed)) on enums and would widen
  # medut_aec_mode_t to 4 bytes, shifting every later config field.
  - '-DMEDUT_NO_PACKED_ENUM=1'
  # Adjust to the local clang resource dir (ls /usr/lib/clang/).
  - '-isystem/usr/lib/clang/21/include'

# Symbol filtering
functions:
  include:
    - 'medut_.*'

globals:
  include:
    - 'MEDUT_.*'

macros:
  include:
    - 'MEDUT_.*'

enums:
  include:
    - 'medut_.*'

structs:
  include:
    - 'medut_.*'

typedefs:
  include:
    - 'medut_.*'

comments:
  style: any
  length: full
