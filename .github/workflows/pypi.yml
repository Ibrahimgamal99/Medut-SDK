name: PyPI

# Publishes the Python binding (bindings/python) as one wheel per desktop
# core: manylinux_2_17 x86_64 and aarch64, win_amd64 and win_arm64. Each is
# tagged py3-none-<platform>: the package reaches medut.so / medut.dll through
# cffi's ABI mode, so one wheel serves every Python 3.9+. No sdist: without a
# core it cannot work, and building one needs the whole native toolchain.
#
# The cores are the ones the Desktop libraries workflow (desktop-libs.yml)
# built and committed for the Flutter plugin, in
# bindings/flutter/{linux,windows}/<arch>/, so they have passed its checks
# (exports, dependencies, glibc 2.17, a load on each platform) and are not
# built a second time here.  Each core's commit names the source commit it
# was built from ("CI build of <sha>"); a core whose sources (src, include,
# cmake, platform, CMakeLists.txt, scripts) changed after that is stale, and
# the run stops rather than ship it.  Each wheel is then installed from the
# built files and imported on its own platform before anything is uploaded.
#
# Release, after a core change, in this order:
#   gh workflow run desktop-libs.yml -f commit=true   # wait for its commit
#   git pull
#   git tag v2.0.0 && git push origin v2.0.0          # matches pyproject.toml
# A manual run is a dry run: it builds and tests the wheels, leaves them as
# the run's "wheels" artifact, and uploads nothing.
#   gh workflow run pypi.yml
#
# Uploads use Trusted Publishing, so there is no token to store. pypi.org has
# a GitHub publisher for this repository, workflow pypi.yml, environment
# "pypi", which exists under the repository's Settings → Environments.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pypi-${{ github.ref }}
  cancel-in-progress: false

jobs:
  wheels:
    runs-on: ubuntu-24.04
    name: Build wheels
    steps:
      # Full history: the staleness check below compares each core's source
      # commit with this one.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check the version
        run: |
          VERSION=$(python -c 'import tomllib; print(tomllib.load(open("bindings/python/pyproject.toml", "rb"))["project"]["version"])')
          echo "medut ${VERSION}"
          if [ "${GITHUB_REF_TYPE}" = tag ] && [ "${GITHUB_REF_NAME}" != "v${VERSION}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match pyproject.toml version ${VERSION}"
            exit 1
          fi

      # The same pipeline as build.sh, so a published wheel's cffi view of
      # the C API cannot drift from a local one. Its awk needs gawk. It must
      # also reproduce the committed header exactly: 1.0.0 shipped one this
      # runner's gcc had widened (every bool to int), which no check saw.
      - name: Regenerate the cffi header
        run: |
          sudo apt-get install -y --no-install-recommends gawk
          bash bindings/python/gen_header.sh
          git diff --exit-code bindings/python/medut/_medut_clean.h \
            || { echo "::error::_medut_clean.h regenerated differently on this runner than the committed copy"; exit 1; }

      # The committed cores must have been built from this commit's core
      # sources.  The last commit that touched a core's directory is the
      # Desktop libraries commit that put it there, and its message names the
      # source commit; when the sources changed since, the core does not
      # match what is being released.
      - name: Check the committed cores are current
        run: |
          stale=0
          for core in linux/x64 linux/arm64 windows/x64 windows/arm64; do
            dir="bindings/flutter/${core}"
            if ! compgen -G "${dir}/medut.*" >/dev/null; then
              echo "::error::${dir}: no committed core"; stale=1; continue
            fi
            msg=$(git log -1 --format=%s -- "${dir}")
            built=$(sed -n 's/.*(CI build of \([0-9a-f]\{7,40\}\)).*/\1/p' <<<"${msg}")
            if [ -z "${built}" ]; then
              echo "::error::${dir}: last changed by \"${msg}\", not a Desktop libraries commit"
              stale=1; continue
            fi
            if ! git diff --quiet "${built}" HEAD -- \
                 src include cmake platform CMakeLists.txt scripts; then
              echo "::error::${dir}: built from ${built}, and the core sources changed since"
              stale=1; continue
            fi
            echo "${dir}: built from ${built}, current"
          done
          if [ "${stale}" = 1 ]; then
            echo "::error::Run Desktop libraries with commit=true, then run this on (or tag) its commit"
            exit 1
          fi

      # setup.py packs whichever core sits in medut/, and the wheel is built
      # on this host, so each one is retagged for the platform it carries.
      # Not auditwheel: libpulse must stay the system's (it talks to the
      # running sound server), and the core already passed the glibc 2.17
      # check in desktop-libs.yml.  ${core/-//} turns linux-x64 into the
      # plugin's directory, linux/x64.
      - name: Build wheels
        working-directory: bindings/python
        run: |
          pip install build wheel twine
          declare -A PLATFORM=(
            [linux-x64]=manylinux_2_17_x86_64.manylinux2014_x86_64
            [linux-arm64]=manylinux_2_17_aarch64.manylinux2014_aarch64
            [windows-x64]=win_amd64
            [windows-arm64]=win_arm64
          )
          OUT="${RUNNER_TEMP}/wheels"
          mkdir -p "${OUT}"
          for core in "${!PLATFORM[@]}"; do
            rm -rf build dist *.egg-info medut/medut.so medut/medut.dll medut/medut.dylib
            cp "../flutter/${core/-//}"/medut.* medut/
            chmod 755 medut/medut.*
            python -m build --wheel --outdir dist
            python -m wheel tags --remove --platform-tag "${PLATFORM[$core]}" dist/*.whl
            mv dist/*.whl "${OUT}/"
          done
          ls -l "${OUT}"
          [ "$(ls "${OUT}" | wc -l)" -eq 4 ] || { echo "::error::expected 4 wheels"; exit 1; }
          twine check --strict "${OUT}"/*.whl

      - uses: actions/upload-artifact@v4
        with:
          name: wheels
          path: ${{ runner.temp }}/wheels/*.whl
          if-no-files-found: error

  # pip picks the wheel itself from the four built, so a wrong platform tag
  # fails here too.
  test:
    needs: wheels
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            runner: ubuntu-24.04
          - name: Linux arm64
            runner: ubuntu-24.04-arm
          - name: Windows x64
            runner: windows-2022
          - name: Windows arm64
            runner: windows-11-arm
    runs-on: ${{ matrix.runner }}
    name: Test wheel · ${{ matrix.name }}
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Runtime libraries
        if: runner.os == 'Linux'
        run: sudo apt-get install -y --no-install-recommends libpulse0

      - uses: actions/download-artifact@v4
        with:
          name: wheels
          path: wheels

      - name: Install
        run: |
          pip install cffi
          pip install --no-index --find-links wheels medut

      # Loads the bundled core through the package's own loader and calls
      # into it. The loader also checks medut_config_t against the core.
      - name: Import
        run: python -c "import medut; from medut._loader import ffi, lib, _find_lib; print(_find_lib()); print('medut', ffi.string(lib.medut_version()).decode())"

      - uses: actions/checkout@v4
        with:
          sparse-checkout: bindings/python/ci
          path: src

      # medut_init() with the config the binding builds: the call 1.0.0's
      # wheels could never make.
      - name: Init
        run: python src/bindings/python/ci/init_check.py

  publish:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    name: Upload to PyPI
    environment:
      name: pypi
      url: https://pypi.org/project/medut/
    permissions:
      id-token: write   # Trusted Publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: wheels
          path: dist

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
