name: Flutter plugin

# The Dart side of the plugin: analyzer and unit tests. The tests fake the
# native side at the Pigeon channels, so no native build is needed here.
#
# The iOS xcframework, MedutKit and the example app are built by
# ios-xcframework.yml (manual). Android is built locally with
# scripts/build-android.sh; after a native change, run it and then
# `flutter build apk --debug` in bindings/flutter/example to prove the
# jniLibs still line up with the Kotlin SDK's JNI layer.
on:
  workflow_dispatch:
  push:
    paths:
      - "bindings/flutter/**"
      - ".github/workflows/build-mobile.yml"
  pull_request:
    paths:
      - "bindings/flutter/**"

jobs:
  dart:
    runs-on: ubuntu-22.04
    name: Flutter · analyze + tests
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Analyze
        working-directory: bindings/flutter
        run: |
          flutter pub get
          dart analyze lib

      - name: Tests
        working-directory: bindings/flutter
        run: flutter test
