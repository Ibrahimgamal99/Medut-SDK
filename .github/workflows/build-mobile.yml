name: Build mobile libraries

# Manual only: this workflow is not run on push. Start it from the Actions tab
# (or `gh workflow run build-mobile.yml`) when native sources change.
#
# iOS only: Android is built locally with scripts/build-android.sh, so no
# Android job here. That means nothing on CI proves the freshly built jniLibs
# still line up with the Dart/Kotlin plugin (FFI symbol names, the plugin class,
# the JNI bridge); after a native change, run scripts/build-android.sh and then
# `flutter build apk --debug` in bindings/flutter/example locally to cover it.
on:
  workflow_dispatch:

jobs:
  # ── iOS: dynamic xcframework (device arm64 + simulator arm64/x86_64) ────
  # The example app is built in this same job on purpose. Round-tripping the
  # xcframework through upload/download-artifact would flatten the framework's
  # symlinks and drop the exec bit on its Mach-O binary, so the pod would
  # vendor something that cannot link.
  ios:
    runs-on: macos-14
    name: iOS · Medut.xcframework + example app
    steps:
      - uses: actions/checkout@v4

      - name: Build xcframework (fetches third_party, verifies, syncs plugin)
        run: bash scripts/build-ios.sh

      - name: Upload xcframework
        uses: actions/upload-artifact@v4
        with:
          name: ios-xcframework
          path: dist/ios/Medut.xcframework/
          if-no-files-found: error

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # build-ios.sh stages the xcframework into bindings/flutter/ios/Frameworks,
      # which is what medut.podspec vendors — so `pod install` resolves here
      # and its prepare_command guard passes. No signing identity on CI.
      - name: Build example app (no codesign)
        working-directory: bindings/flutter/example
        run: |
          flutter pub get
          flutter build ios --debug --no-codesign

  # ── Dart binding: analyzer + tests against a real native build ───────────
  # The native library is built first so test/medut_smoke_test.dart actually
  # runs. It self-skips when dist/linux/x86_64/medut.so is missing, so
  # without this the job passed while executing nothing.
  dart:
    runs-on: ubuntu-22.04
    name: Dart · analyze + tests
    steps:
      - uses: actions/checkout@v4

      - name: Install native build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build gcc g++ pkg-config libssl-dev libpulse-dev

      # AEC off: the webrtc_aec module needs libwebrtc-audio-processing-1, which
      # has no ubuntu-22.04 package and would mean building it from source here.
      # Nothing under test/ exercises AEC.
      - name: Build native library
        run: bash scripts/build-linux.sh
        env:
          MEDUT_WITH_WEBRTC_AEC: 'OFF'

      # Guards against silently going back to a vacuous test run. The smoke
      # test resolves this same path relative to bindings/flutter.
      - name: Assert the tests have a library to load
        run: test -f dist/linux/x86_64/medut.so

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Analyze
        working-directory: bindings/flutter
        run: |
          flutter pub get
          dart analyze lib

      - name: Tests (e2e_asterisk_test self-skips without a SIP server)
        working-directory: bindings/flutter
        run: flutter test
