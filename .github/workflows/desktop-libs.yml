name: Desktop libraries

# Builds every desktop core the Flutter plugin ships, each on a native
# runner: medut.dll for Windows x64 and arm64, and medut.so for Linux x64 and
# arm64 in the manylinux2014 image (glibc 2.17, OpenSSL linked in), so it
# runs on old distros too. Every library is checked (exports, machine,
# dependencies, a real load) and the x64 ones also run the plugin's FFI smoke
# test. Each one is published as a run artifact, and on request committed to
# the branch that was built.
#
# Start it from the Actions tab or with
#   gh workflow run desktop-libs.yml                 # artifacts only
#   gh workflow run desktop-libs.yml -f commit=true  # and commit them back
# The committed copies are bindings/flutter/{windows,linux}/<arch>/medut.*;
# the plugin's CMakeLists bundle the one matching the app's target. A library
# whose job failed is not committed.
#
# pypi.yml also runs it, as a reusable workflow, to build the cores its
# wheels carry (never committing them).
#
# scripts/build-linux.sh (no MEDUT_PORTABLE) is for local development: it
# links the system OpenSSL and leaves the committed libraries alone.
on:
  workflow_dispatch:
    inputs:
      commit:
        description: "Commit the built libraries to bindings/flutter/{windows,linux}/<arch> on this branch"
        type: boolean
        default: false
  workflow_call:
    inputs:
      commit:
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: desktop-libs-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: windows-2022
            machine: x64
          - arch: arm64
            runner: windows-11-arm
            machine: ARM64
    runs-on: ${{ matrix.runner }}
    name: Windows ${{ matrix.arch }} · medut.dll
    defaults:
      run:
        shell: pwsh
    env:
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}\.vcpkg-bincache
    steps:
      # The runner image defaults to autocrlf=true; the build's source
      # patches (cmake/patch-*.cmake) and the committed header expect LF.
      - name: Keep LF line endings
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v4

      # The x64 image ships vcpkg at VCPKG_INSTALLATION_ROOT; bootstrap one
      # where the image has none. Cache the built packages per vcpkg
      # revision: OpenSSL alone takes minutes.
      - name: vcpkg
        id: vcpkg
        run: |
          $root = $env:VCPKG_INSTALLATION_ROOT
          if (-not $root -or -not (Test-Path "$root\vcpkg.exe")) {
            $root = "C:\vcpkg-medut"
            git clone -q https://github.com/microsoft/vcpkg.git $root
            & "$root\bootstrap-vcpkg.bat" -disableMetrics
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          "VCPKG_ROOT=$root" >> $env:GITHUB_ENV
          New-Item -ItemType Directory -Force $env:VCPKG_DEFAULT_BINARY_CACHE | Out-Null
          "rev=$(git -C $root rev-parse HEAD)" >> $env:GITHUB_OUTPUT

      - uses: actions/cache@v4
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: vcpkg-${{ matrix.arch }}-windows-static-md-openssl-zlib-${{ steps.vcpkg.outputs.rev }}

      - name: vcpkg install openssl zlib
        run: |
          & "$env:VCPKG_ROOT\vcpkg.exe" install `
            "openssl:${{ matrix.arch }}-windows-static-md" "zlib:${{ matrix.arch }}-windows-static-md"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # Fetches third_party at the pinned revisions, builds the core, links
      # dist\windows\<arch>\medut.dll and stages it in
      # bindings\flutter\windows\<arch>.
      - name: Build medut.dll
        run: ./scripts/build-windows.ps1 -Arch ${{ matrix.arch }} -VcpkgRoot $env:VCPKG_ROOT

      # The C API must be exported by name (dart:ffi looks every symbol up),
      # the DLL must be for the right machine, and it may only need system
      # DLLs and the MSVC runtime: OpenSSL and zlib are linked in, not
      # shipped beside it.
      - name: Verify exports, machine and imports
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -property installationPath
          $dumpbin = (Get-Item "$vs\VC\Tools\MSVC\*\bin\Host*\*\dumpbin.exe" | Select-Object -First 1).FullName
          $dll = "bindings\flutter\windows\${{ matrix.arch }}\medut.dll"

          $exports = & $dumpbin /nologo /exports $dll | Select-String '\smedut_\w+$' |
            ForEach-Object { ($_.Line -split '\s+')[-1] }
          $expected = Select-String -Path include\medut.h -Pattern '^\s*MEDUT_EXPORT\s' | Measure-Object
          Write-Host "$($exports.Count) medut_* exports (medut.h declares $($expected.Count))"
          if ($exports.Count -lt $expected.Count) { Write-Error "medut.dll is missing exports"; exit 1 }
          if ($exports -notcontains 'medut_account_refresh_registration') {
            Write-Error "medut_account_refresh_registration missing"; exit 1
          }

          $machine = & $dumpbin /nologo /headers $dll | Select-String 'machine \(' | Select-Object -First 1
          Write-Host "Header: $($machine.Line.Trim())"
          if ($machine.Line -notmatch '\(${{ matrix.machine }}\)') { Write-Error "not a ${{ matrix.machine }} DLL"; exit 1 }

          $imports = & $dumpbin /nologo /dependents $dll | Select-String '^\s+\S+\.dll$' |
            ForEach-Object { $_.Line.Trim() }
          Write-Host "Imports: $($imports -join ', ')"
          $foreign = $imports | Where-Object { $_ -match '(?i)^(libssl|libcrypto|zlib)' }
          if ($foreign) { Write-Error "medut.dll needs $($foreign -join ', ') beside it"; exit 1 }

      # Load it the way an app does and call into it: catches a missing
      # dependency that dumpbin cannot see. pwsh runs native on both runners.
      - name: Load test
        run: |
          $dll = (Resolve-Path "bindings\flutter\windows\${{ matrix.arch }}\medut.dll").Path
          Add-Type -TypeDefinition @"
          using System;
          using System.Runtime.InteropServices;
          public static class MedutProbe {
            [DllImport(@"$dll", CallingConvention = CallingConvention.Cdecl)]
            public static extern IntPtr medut_version();
          }
          "@
          $v = [Runtime.InteropServices.Marshal]::PtrToStringAnsi([MedutProbe]::medut_version())
          Write-Host "medut_version() = $v"
          if (-not $v) { Write-Error "medut_version() returned nothing"; exit 1 }

      - uses: subosito/flutter-action@v2
        if: matrix.arch == 'x64'
        with:
          channel: stable
          cache: true

      # The plugin's Dart FFI backend against the DLL just built: starts the
      # stack, registers against a black-hole registrar, detaches and
      # reattaches, shuts down. x64 only: the Flutter SDK has no Windows
      # arm64 host build to run it on.
      - name: FFI smoke test
        if: matrix.arch == 'x64'
        working-directory: bindings/flutter
        run: |
          flutter pub get
          flutter test test/medut_smoke_test.dart

      - name: Upload plugin library
        uses: actions/upload-artifact@v4
        with:
          name: plugin-windows-${{ matrix.arch }}
          path: bindings/flutter/windows/${{ matrix.arch }}/medut.dll
          if-no-files-found: error

      # For C/C++ consumers: the DLL, its import library and the headers.
      - name: Upload SDK
        uses: actions/upload-artifact@v4
        with:
          name: medut-windows-${{ matrix.arch }}
          path: |
            dist/windows/${{ matrix.arch }}/medut.dll
            dist/windows/${{ matrix.arch }}/medut.lib
            dist/windows/${{ matrix.arch }}/include/
          if-no-files-found: error

  linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-24.04
            machine: x86_64
          - arch: arm64
            runner: ubuntu-24.04-arm
            machine: aarch64
    runs-on: ${{ matrix.runner }}
    name: Linux ${{ matrix.arch }} · medut.so
    env:
      # CentOS 7 / glibc 2.17: the oldest system the library supports. Pinned
      # so a rebuild of the same commit gets the same toolchain.
      IMAGE: quay.io/pypa/manylinux2014_${{ matrix.machine }}:2026.10.16-1
    steps:
      - uses: actions/checkout@v4

      # webrtc-audio-processing 1.3, built in the image by the script below.
      - uses: actions/cache@v4
        with:
          path: .cache
          key: webrtc-audio-processing-1.3-manylinux2014-${{ matrix.machine }}-v1

      # Clone third_party (OpenSSL included) on the runner, so the container
      # only builds; the script finds the trees at their pinned revisions.
      - name: Fetch third_party
        run: MEDUT_OPENSSL_SRC=1 bash scripts/fetch-third-party.sh

      # Builds medut.so with OpenSSL linked in, checks its exports and that
      # it needs nothing newer than glibc 2.17, loads it in the image, and
      # stages it in bindings/flutter/linux/<arch>. Runs as plain docker on
      # the runner (JavaScript actions cannot run inside a glibc 2.17 image).
      - name: Build medut.so (manylinux2014)
        run: |
          docker run --rm -v "$PWD:/src" -w /src "$IMAGE" \
            bash scripts/build-linux-portable.sh

      - name: Verify machine and dependencies
        run: |
          SO=bindings/flutter/linux/${{ matrix.arch }}/medut.so
          file "${SO}"
          file "${SO}" | grep -q '${{ matrix.arch == 'x64' && 'x86-64' || 'ARM aarch64' }}' \
            || { echo "::error::wrong architecture"; exit 1; }
          readelf -d "${SO}" | grep NEEDED
          if readelf -d "${SO}" | grep -Eq 'NEEDED.*lib(ssl|crypto)'; then
            echo "::error::medut.so links the system OpenSSL"; exit 1
          fi

      # The plugin's Dart FFI backend against the library just built, on a
      # current distro. x64 only: the Flutter SDK has no Linux arm64 host
      # build to run it on.
      - name: Runtime libraries for the FFI smoke test
        if: matrix.arch == 'x64'
        run: sudo apt-get install -y --no-install-recommends libpulse0

      - uses: subosito/flutter-action@v2
        if: matrix.arch == 'x64'
        with:
          channel: stable
          cache: true

      - name: FFI smoke test
        if: matrix.arch == 'x64'
        working-directory: bindings/flutter
        run: |
          flutter pub get
          flutter test test/medut_smoke_test.dart

      - name: Upload plugin library
        uses: actions/upload-artifact@v4
        with:
          name: plugin-linux-${{ matrix.arch }}
          path: bindings/flutter/linux/${{ matrix.arch }}/medut.so
          if-no-files-found: error

      # For C/C++ consumers: the unstripped library, the static archive
      # (OpenSSL included) and the headers.
      - name: Upload SDK
        uses: actions/upload-artifact@v4
        with:
          name: medut-linux-${{ matrix.arch }}
          path: |
            dist/linux/${{ matrix.machine }}/medut.so
            dist/linux/${{ matrix.machine }}/medut.a
            dist/linux/${{ matrix.machine }}/include/
          if-no-files-found: error

  # One commit for every library that built and passed its checks, so the
  # parallel jobs never race each other to push.
  commit:
    needs: [windows, linux]
    if: ${{ !cancelled() && inputs.commit }}
    runs-on: ubuntu-24.04
    name: Commit libraries to the branch
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: plugin-*
          path: ${{ runner.temp }}/plugin

      - name: Commit
        run: |
          shopt -s nullglob
          DONE=()
          for d in "${RUNNER_TEMP}"/plugin/plugin-*; do
            name="${d##*/plugin-}"   # windows-x64, windows-arm64, linux-x64, linux-arm64
            os="${name%-*}"; arch="${name##*-}"
            mkdir -p "bindings/flutter/${os}/${arch}"
            cp "${d}"/* "bindings/flutter/${os}/${arch}/"
            # upload-artifact drops the exec bit; git records it.
            chmod 755 "bindings/flutter/${os}/${arch}"/medut.*
            git add -f "bindings/flutter/${os}/${arch}"
            DONE+=("${os} ${arch}")
          done
          if [ ${#DONE[@]} -eq 0 ]; then
            echo "::error::no library built; nothing to commit"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --cached --quiet; then
            echo "libraries unchanged; nothing to commit"
            exit 0
          fi
          LIST=$(IFS=,; echo "${DONE[*]}" | sed 's/,/, /g')
          git commit -m "desktop: refresh the plugin's cores: ${LIST} (CI build of ${GITHUB_SHA::12})"
          # The branch may have moved since checkout: the other prebuilt
          # workflow (desktop-libs.yml / ios-xcframework.yml) commits to it
          # too, and a run started alongside this one pushes first. They
          # touch different files, so rebasing onto it always applies.
          for attempt in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}" &&
              git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep 10
          done
          echo "::error::could not push to ${GITHUB_REF_NAME} after 3 attempts"
          exit 1
