; Asterisk interop target for Medut (test/interop).  Every transport, every
; media profile the SDK offers, and accounts to call between.
;
; Accounts (password "medut" for all), each with a second one to call:
;   plain1 plain2    RTP, no encryption              UDP / TCP / TLS
;   sdes1  sdes2     SRTP keyed with SDES (a=crypto)  TLS (or any)
;   ice1   ice2      RTP + ICE                        UDP / TCP / TLS
;   rtc1   rtc2      WebRTC: DTLS-SRTP, ICE, rtcp-mux WS / WSS (or any)
; Dial 600 for an echo, 601 for a 1004 Hz tone, or another account's name.
; plain1/plain2 also have the services outside a call: a voicemail box each
; (MWI), presence hints (BLF) and MESSAGE between them (extensions.conf), and
; pass a hold on to each other (moh_passthrough) instead of playing music.

[global]
type=global
user_agent=Medut-interop-Asterisk

[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060

[transport-tcp]
type=transport
protocol=tcp
bind=0.0.0.0:5060

[transport-tls]
type=transport
protocol=tls
bind=0.0.0.0:5061
cert_file=/etc/asterisk/keys/interop.crt
priv_key_file=/etc/asterisk/keys/interop.key
method=tlsv1_2

; WebSocket transports are served by http.conf (8088 ws, 8089 wss).
[transport-ws]
type=transport
protocol=ws
bind=0.0.0.0

[transport-wss]
type=transport
protocol=wss
bind=0.0.0.0

; ── templates ────────────────────────────────────────────────────────────────

[ep](!)
type=endpoint
context=test
disallow=all
allow=opus,ulaw,alaw
direct_media=no
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes
dtmf_mode=rfc4733

[auth](!)
type=auth
auth_type=userpass
password=medut

[aor](!)
type=aor
max_contacts=5
remove_existing=yes

; ── plain RTP ────────────────────────────────────────────────────────────────

[plain1](ep)
auth=plain1
aors=plain1
mailboxes=plain1@default
message_context=messages
moh_passthrough=yes
[plain1](auth)
username=plain1
[plain1](aor)

[plain2](ep)
auth=plain2
aors=plain2
mailboxes=plain2@default
message_context=messages
moh_passthrough=yes
[plain2](auth)
username=plain2
[plain2](aor)

; ── SDES-SRTP ────────────────────────────────────────────────────────────────

[sdes1](ep)
auth=sdes1
aors=sdes1
media_encryption=sdes
[sdes1](auth)
username=sdes1
[sdes1](aor)

[sdes2](ep)
auth=sdes2
aors=sdes2
media_encryption=sdes
[sdes2](auth)
username=sdes2
[sdes2](aor)

; ── RTP + ICE ────────────────────────────────────────────────────────────────

[ice1](ep)
auth=ice1
aors=ice1
ice_support=yes
[ice1](auth)
username=ice1
[ice1](aor)

[ice2](ep)
auth=ice2
aors=ice2
ice_support=yes
[ice2](auth)
username=ice2
[ice2](aor)

; ── WebRTC: DTLS-SRTP + ICE + rtcp-mux (+ AVPF) ─────────────────────────────

[rtc1](ep)
auth=rtc1
aors=rtc1
webrtc=yes
[rtc1](auth)
username=rtc1
[rtc1](aor)

[rtc2](ep)
auth=rtc2
aors=rtc2
webrtc=yes
[rtc2](auth)
username=rtc2
[rtc2](aor)
