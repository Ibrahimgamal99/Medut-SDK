; Dialplan for the Medut interop target (see pjsip.conf).
[general]
static=yes
writeprotect=yes

[test]
; Immediate echo — no prompt, so measurements start at once.
exten => 600,1,Answer()
 same => n,Echo()
 same => n,Hangup()

; 1004 Hz tone.
exten => 601,1,Answer()
 same => n,Milliwatt()
 same => n,Hangup()

; Another account, by name.
exten => _[a-z].,1,Dial(PJSIP/${EXTEN},30)
 same => n,Hangup()

; Presence of plain1/plain2 (SUBSCRIBE Event: presence to them).
exten => plain1,hint,PJSIP/plain1
exten => plain2,hint,PJSIP/plain2

; A MESSAGE from plain1/plain2 (pjsip.conf message_context), passed on to
; the account it is for.
[messages]
exten => _[a-z].,1,MessageSend(pjsip:${EXTEN},${MESSAGE(from)})
 same => n,Hangup()
